<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

<!-- ══ 帳戶總覽 ══════════════════════════════════ -->
<section class="page" id="page-accounts">
  <div class="pg-title-center">帳戶總覽</div>
  <div id="acc-summary" class="acc-summary"></div>
  <!-- 資產/負債 切換 -->
  <div class="acc-view-tabs">
    <button class="acc-view-tab on" id="acc-tab-asset" onclick="switchAccTab('asset')">資產</button>
    <button class="acc-view-tab" id="acc-tab-debt" onclick="switchAccTab('debt')">負債</button>
  </div>
  <!-- 資產：按分組折疊顯示帳戶 -->
  <div id="acc-groups"></div>
  <!-- 負債列表 -->
  <div id="acc-debt-section" style="display:none"></div>
</section>

<!-- ══ 首頁 ══════════════════════════════════════ -->
<section class="page active" id="page-home" style="display:flex;flex-direction:column;overflow:hidden;padding:0">
  <!-- 固定上半：日曆區 -->
  <div id="home-header" style="flex-shrink:0;padding:12px 16px 6px;background:var(--bg);">
    <div class="cal-nav">
      <div class="mbtn" id="cal-prev">◀</div>
      <div class="cal-nav-center">
        <div class="sel-date-bar">
          <div class="sd-big" id="sd-big"></div>
          <div class="sd-dow" id="sd-dow"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <div class="mbtn" id="cal-next">▶</div>
        <button id="search-btn" onclick="openSearch()" style="width:30px;height:30px;border-radius:50%;background:var(--sf2);border:1px solid var(--border);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;padding:0;overflow:hidden;"><img src="/icon/搜尋.png" width="30" height="30" style="object-fit:contain;"></button>
      </div>
    </div>
    <!-- 月曆格 -->
    <div class="month-grid" id="month-grid"></div>
    <!-- 流水帳標題 -->
    <div class="sec-title" style="margin-bottom:6px">
      <span id="day-label">今日記錄</span>
      <span id="acc-filter" style="margin-left:8px;color:var(--t3);font-size:14px;cursor:pointer;display:none"></span>
    </div>
  </div>
  <!-- 可滑動下半：記錄列表 -->
  <div id="rec-list" class="rec-list" style="flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:4px;"></div>
</section>

<!-- ══ 報表 ══════════════════════════════════════ -->
<section class="page" id="page-report">
  <div class="pg-title-center">報表</div>
  <div class="rpt-tabs" id="rpt-big-tabs" style="margin-bottom:10px">
    <button class="rpt-tab on" data-bigv="monthly">每月報表</button>
    <button class="rpt-tab" data-bigv="yearly">年度報表</button>
  </div>
  <div id="rpt-monthly">
    <div class="month-nav">
      <div class="mbtn" id="rpt-prev">◀</div>
      <h2 id="rpt-label"></h2>
      <div class="mbtn" id="rpt-next">▶</div>
    </div>
    <div class="rpt-tabs" id="rpt-small-tabs">
      <button class="rpt-tab on" data-rv="overview">總覽</button>
      <button class="rpt-tab" data-rv="cat">類別</button>
      <button class="rpt-tab" data-rv="merchant">商家</button>
      <button class="rpt-tab" data-rv="trend">趨勢</button>
    </div>
    <div id="rv-trend" class="rpt-card" style="display:none"></div>
    <div id="rv-overview-wrap">
      <div id="rv-overview" class="rpt-card"></div>
      <div id="rv-ov-cat" class="rpt-card"></div>
      <div id="rv-ov-top3" class="rpt-card"></div>
      <div id="rv-ov-mer" class="rpt-card"></div>
    </div>
    <div id="rv-cat" class="rpt-card" style="display:none"></div>
    <div id="rv-merchant" class="rpt-card" style="display:none"></div>
  </div>
  <div id="rpt-yearly" style="display:none">
    <div class="month-nav">
      <div class="mbtn" id="rpt-yr-prev">◀</div>
      <h2 id="rpt-yr-label"></h2>
      <div class="mbtn" id="rpt-yr-next">▶</div>
    </div>
    <div id="rv-yearly" class="rpt-card"></div>
  </div>
</section>

<!-- ══ 功能 ══════════════════════════════════════ -->
<section class="page" id="page-settings">
  <div class="fn-title">更多功能</div>

  <div class="set-sec">
    <h3>備份 / 還原</h3>
    <div class="set-list">
      <div class="set-row" onclick="doBackup()"><span class="sn">本機備份</span><span class="arr">↓</span></div>
      <div class="set-row" onclick="doRestore()"><span class="sn">還原備份</span><span class="arr">↑</span></div>
      <div class="set-row" onclick="doClearRecords()"><span class="sn" style="color:var(--red)">清除所有紀錄（保留設定）</span><span class="arr" style="color:var(--red)">!</span></div>
      <div class="set-row" onclick="doReset()"><span class="sn" style="color:var(--red)">完全重置（清除所有資料）</span><span class="arr" style="color:var(--red)">!</span></div>
    </div>
  </div>

  <div class="set-sec">
    <h3>設定</h3>
    <div class="set-list">
      <div class="set-row" onclick="openSubPage('categories')"><span class="sn">類別</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('merchants')"><span class="sn">商家</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('experts')"><span class="sn">專案</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('note_tags')"><span class="sn">備註標籤</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('account_groups')"><span class="sn">帳戶分組</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('accounts')"><span class="sn">帳戶</span><span class="arr">›</span></div>
    </div>
  </div>
  <div class="set-sec">
    <h3>進階功能</h3>
    <div class="set-list">
      <div class="set-row" onclick="openAdvPage('piggy')">
        <span class="sn" style="display:flex;align-items:center;gap:10px">
          <img src="/icon/存錢筒.png" width="24" height="24" style="object-fit:contain;flex-shrink:0;">
          存錢筒
        </span><span class="arr">›</span>
      </div>
      <div class="set-row" onclick="openAdvPage('budget')">
        <span class="sn" style="display:flex;align-items:center;gap:10px">
          <img src="/icon/預算.png" width="24" height="24" style="object-fit:contain;flex-shrink:0;">
          預算管理
        </span><span class="arr">›</span>
      </div>
      <div class="set-row" onclick="openAdvPage('recurring')">
        <span class="sn" style="display:flex;align-items:center;gap:10px">
          <img src="/icon/安排.png" width="24" height="24" style="object-fit:contain;flex-shrink:0;">
          固定支出／收入
        </span><span class="arr">›</span>
      </div>
    </div>
  </div>

</section>

<!-- ══ 底部導覽 ════════════════════════════════ -->
<nav id="nav">
  <div class="ni" data-pg="accounts"><img class="nav-icon" src="/guide/帳戶.png" alt="帳戶"><span class="lb">帳戶</span></div>
  <div class="ni active" data-pg="home"><img class="nav-icon" src="/guide/首頁.png" alt="首頁"><span class="lb">首頁</span></div>
  <div class="nav-plus" id="nav-plus">＋</div>
  <div class="ni" data-pg="report"><img class="nav-icon" src="/guide/報表.png" alt="報表"><span class="lb">報表</span></div>
  <div class="ni" data-pg="settings"><img class="nav-icon" src="/guide/功能.png" alt="功能"><span class="lb">功能</span></div>
</nav>
</div>

<!-- ══ 新增記錄 Overlay ═══════════════════════ -->
<div class="overlay-page" id="add-page">
  <div class="top-bar">
    <button class="bar-btn" id="add-cancel">✕</button>
    <h2>新增記錄</h2>
    <button class="bar-btn confirm" id="add-confirm">✓</button>
  </div>
  <div class="overlay-body">
    <input type="date" id="f-date" style="position:fixed;left:-9999px;opacity:0;pointer-events:none;">
    <input type="time" id="f-time" style="position:fixed;left:-9999px;opacity:0;pointer-events:none;">
    <!-- 支出/收入/轉帳 -->
    <div class="type-tabs">
      <button class="type-tab on expense" data-t="expense">支出</button>
      <button class="type-tab" data-t="income">收入</button>
      <button class="type-tab" data-t="transfer">轉帳</button>
      <button class="type-tab" data-t="adjust">調整</button>
      <button class="type-tab" data-t="piggy">存錢筒</button>
    </div>
    <!-- 存錢筒模式：選擇存錢筒 + 金額 -->
    <div id="piggy-type-section" style="display:none">
      <div class="cat-lbl">選擇存錢筒</div>
      <div id="piggy-type-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;"></div>
    </div>
    <!-- 轉帳類型（置中）-->
    <div class="transfer-type" id="transfer-type" style="display:none;text-align:center">
      <div class="cat-lbl" style="text-align:center">轉帳類別</div>
      <div class="cat-grid" id="transfer-type-grid" style="justify-content:center"></div>
    </div>
    <!-- 總金額（存錢筒時隱藏）-->
    <div class="total-disp" id="total-disp">
      <div class="lbl">總金額（自動加總）</div>
      <div class="val"><span class="cur">NT$</span><span id="total-val">0</span></div>
    </div>
    <!-- 記帳項目（每項可設定分類） -->
    <div class="cat-section" id="cat-section" style="display:none">
      <div class="cat-lbl">分類</div>
      <div class="cat-grid" id="modal-cat-grid"></div>
    </div>
    <!-- 記帳項目 -->
    <div class="items-section">
      <div class="items-lbl">記帳項目</div>
      <div id="items-list"></div>
      <button class="add-item-btn" id="add-item-btn">＋ 新增一項</button>
    </div>
    <!-- 日期時間 -->
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <div class="fg" style="flex:1">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">日期</label>
        <input type="date" class="finp" id="f-date-vis" oninput="document.getElementById('f-date').value=this.value;syncDateBadge(this.value,document.getElementById('f-time-vis').value)">
      </div>
      <div class="fg" style="flex:1">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">時間</label>
        <input type="time" class="finp" id="f-time-vis" oninput="document.getElementById('f-time').value=this.value;syncDateBadge(document.getElementById('f-date-vis').value,this.value)">
      </div>
    </div>
    <!-- 帳戶（支出/收入/調整 standalone，轉帳/存錢筒隱藏）-->
    <div id="standalone-acc" style="margin-bottom:14px;display:none">
      <div class="fg">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">帳戶</label>
        <select class="fsel" id="f-acc"></select>
      </div>
    </div>
    <!-- 商家/收入來源（支出/收入 standalone）-->
    <div id="standalone-mer" style="margin-bottom:14px;display:none">
      <div class="fg">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">商家</label>
        <select class="fsel" id="f-mer"></select>
      </div>
    </div>
    <!-- 備註（存錢筒專用，在最下方）-->
    <div id="piggy-note-row" style="margin-bottom:14px;display:none">
      <div class="fg">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">備註</label>
        <input type="text" class="finp" id="f-note" placeholder="選填">
      </div>
    </div>
    <!-- 其他資訊（支出/收入，折疊）-->
    <div class="info-section" id="info-section">
      <div class="info-toggle" id="info-toggle">
        <span>其他資訊</span><span class="arrow">▼</span>
      </div>
      <div class="info-body" id="info-body">
        <!-- 備註（支出才顯示，收入隱藏）-->
        <div class="fg" id="info-note-fg">
          <label>備註</label>
          <input type="text" class="finp" id="f-note-ei" placeholder="選填">
        </div>
        <div class="fg"><label>專案</label><select class="fsel" id="f-exp"></select></div>
        <div class="fg" id="fg-to-acc" style="display:none"><label>轉入帳戶</label><select class="fsel" id="f-to-acc"></select></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ 記錄詳情 Overlay ═══════════════════════ -->
<div id="detail-page">
  <div id="detail-box">
    <div class="top-bar">
      <button class="bar-btn" id="detail-close">✕</button>
      <h2>記錄資訊</h2>
      <button class="bar-btn" id="detail-edit-btn">編輯</button>
    </div>
    <div class="overlay-body" id="detail-body"></div>
  </div>
</div>

<!-- ══ 設定子頁 Overlay ═══════════════════════ -->
<div class="overlay-page" id="sub-page">
  <div class="top-bar">
    <button class="bar-btn" id="sub-cancel">✕</button>
    <h2 id="sub-title">類別</h2>
    <button class="bar-btn confirm" id="sub-add">＋</button>
  </div>
  <div class="overlay-body">
    <div id="sub-cat-tabs" style="display:none">
      <div class="type-tabs">
        <button class="type-tab on expense" data-ct="expense">支出</button>
        <button class="type-tab" data-ct="income">收入</button>
        <button class="type-tab" data-ct="transfer">轉帳</button>
      </div>
    </div>
    <div class="set-list" id="sub-list"></div>
  </div>
</div>

<!-- ══ 新增帳戶 mini overlay ══════════════════ -->
<div id="add-acc-overlay">
  <div id="add-acc-box">
    <h3>新增帳戶</h3>
    <div class="fg"><label>帳戶名稱</label><input type="text" class="finp" id="nacc-name" placeholder="例：錢包、國泰銀行"></div>
    <div class="fg"><label>分組</label>
      <select class="fsel" id="nacc-group"></select>
    </div>  
    <!-- options are filled in script to match current settings -->
    <div class="fg"><label>餘額</label><input type="number" class="finp" id="nacc-balance" value="0"></div>
    <div class="fg"><label>餘額日期</label><input type="date" class="finp" id="nacc-balance-date"></div>
    <div class="fg"><label>顏色</label><input type="color" id="nacc-color" value="#cccccc"></div>
    <div class="fg"><label>圖示（選填）</label><div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="file" class="finp" id="nacc-icon" accept="image/*">
      <button class="acc-btn" style="padding:10px 12px;" type="button" id="nacc-icon-builtin">內建圖示</button>
    </div>
      <div style="display:flex;align-items:flex-start;gap:10px;margin-top:6px">
        <div id="nacc-icon-preview"></div>
        <div style="flex:1">
          <label style="font-size:11px;color:var(--t3);">顯示大小</label>
          <input type="range" id="nacc-icon-size" min="24" max="80" value="40" style="width:100%">
        </div>
      </div>
    </div>
    <div class="acc-btns">
      <button class="acc-btn" id="nacc-cancel">取消</button>
      <button class="acc-btn ok" id="nacc-ok">新增</button>
    </div>
  </div>
</div>

<!-- ══ 新增分類 mini overlay ══════════════════ -->
<div id="add-cat-overlay">
  <div id="add-cat-box">
    <h3>新增類別</h3>
    <div class="fg"><label>名稱</label><input type="text" class="finp" id="ncat-name" placeholder="例：交通、餐飲"></div>
    <div class="fg"><label>顏色</label>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="color" id="ncat-colorpicker" value="#8B909A" style="width:40px;height:38px;padding:2px;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;background:var(--sf2)">
        <input type="text" class="finp" id="ncat-color" placeholder="#8B909A" style="flex:1">
      </div>
      <div id="ncat-palette"></div>
    </div>
    <div class="fg"><label>圖示（選填）</label><div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="file" class="finp" id="ncat-icon" accept="image/*">
      <button class="acc-btn" style="padding:10px 12px;" type="button" id="ncat-icon-builtin">內建圖示</button>
    </div>
      <div style="display:flex;align-items:flex-start;gap:10px;margin-top:6px">
        <div id="ncat-icon-preview"></div>
        <div style="flex:1">
          <label style="font-size:11px;color:var(--t3);">顯示大小</label>
          <input type="range" id="ncat-icon-size" min="24" max="80" value="32" style="width:100%">
        </div>
      </div>
    </div>
    <div class="acc-btns">
      <button class="acc-btn" id="ncat-cancel">取消</button>
      <button class="acc-btn ok" id="ncat-ok">新增</button>
    </div>
  </div>
</div>


<!-- ══ 進階功能 Overlay ══════════════════════ -->
<div class="overlay-page" id="adv-page">
  <div class="top-bar">
    <button class="bar-btn" onclick="closeOverlay('adv-page')">✕</button>
    <h2 id="adv-title">進階功能</h2>
    <button class="bar-btn confirm" id="adv-add-btn" onclick="advAddItem()" style="display:none">＋</button>
  </div>
  <div class="overlay-body" id="adv-body"></div>
</div>

<!-- ══ 搜尋記錄 Overlay ══════════════════════ -->
<div class="overlay-page" id="search-page">
  <div class="top-bar">
    <button class="bar-btn" onclick="closeOverlay('search-page')">✕</button>
    <h2>搜尋記錄</h2>
    <div style="width:36px"></div>
  </div>
  <div class="overlay-body">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="text" class="finp" id="search-input" placeholder="關鍵字（備註、商家、金額）" style="flex:1">
      <button onclick="doSearch()" style="padding:10px 14px;border-radius:var(--rs);background:var(--acc);color:#fff;border:none;font-size:14px;cursor:pointer;font-weight:600;">搜</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <select class="fsel" id="search-type" style="flex:1;min-width:80px">
        <option value="">所有類型</option>
        <option value="expense">支出</option>
        <option value="income">收入</option>
        <option value="transfer">轉帳</option>
      </select>
      <input type="date" class="finp" id="search-from" style="flex:1;min-width:110px">
      <input type="date" class="finp" id="search-to" style="flex:1;min-width:110px">
    </div>
    <div id="search-results"></div>
  </div>
</div>

<!-- 備註標籤新增 overlay -->
<div id="add-notetag-overlay" style="position:fixed;inset:0;max-width:430px;margin:0 auto;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:310;
  display:none;align-items:flex-end;justify-content:center;pointer-events:none">
  <div style="background:var(--sf);border-radius:20px 20px 0 0;border-top:1px solid var(--border);
    padding:20px 20px 36px;width:100%;max-height:80vh;overflow-y:auto">
    <h3 style="font-size:15px;font-weight:600;margin-bottom:16px">新增備註標籤</h3>
    <div class="fg" style="margin-bottom:12px">
      <label>標籤名稱</label>
      <input type="text" class="finp" id="ntag-name" placeholder="例：早餐、奶茶">
    </div>
    <div class="fg" style="margin-bottom:6px">
      <label>綁定分類（選填）</label>
    </div>
    <!-- 分層分類選擇 -->
    <div id="ntag-cat-path" style="font-size:12px;color:var(--t3);margin-bottom:6px;min-height:16px"></div>
    <div id="ntag-cat-grid" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px"></div>
    <div id="ntag-cat-selected" style="display:none;margin-bottom:14px;padding:8px 12px;background:var(--acc-d);border:1px solid var(--acc);border-radius:var(--rs);font-size:13px;color:var(--acc);display:flex;align-items:center;justify-content:space-between">
      <span id="ntag-cat-selected-name"></span>
      <button onclick="clearNtagCat()" style="background:none;border:none;color:var(--acc);cursor:pointer;font-size:14px">✕</button>
    </div>
    <div class="acc-btns">
      <button class="acc-btn" id="ntag-cancel">取消</button>
      <button class="acc-btn ok" id="ntag-ok">新增</button>
    </div>
  </div>
</div>

<!-- 【需求 2】內建圖示新視窗（獨立 overlay） -->
<div class="overlay-page" id="icon-picker" style="display:none;z-index:400">
  <div class="top-bar">
    <button class="bar-btn" onclick="closeIconPicker()">✕</button>
    <h2>選擇內建圖示</h2>
  </div>
  <!-- 分類 tab -->
  <div id="icon-cat-tabs" style="display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--sf);overflow-x:auto"></div>
  <!-- 圖示列表 -->
  <div id="icon-list" style="flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;padding:10px;align-content:start;"></div>
</div>

<!-- 自訂確認對話框 -->
<div id="custom-confirm-overlay">
  <div id="custom-confirm-box">
    <div id="custom-confirm-msg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn-cancel" id="confirm-cancel-btn">取消</button>
      <button class="confirm-btn-ok" id="confirm-ok-btn">確定刪除</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="restore-file" accept=".json" style="display:none">

<script src="/script.js"></script>
</body>
</html>
