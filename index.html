<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
/* ══ Tokens ═══════════════════════════════════ */
:root{
  --bg:#F7F9FC;--sf:#FFFFFF;--sf2:#F1F5FB;
  --border:rgba(15,23,42,0.08);
  --acc:#16A34A;--acc-d:rgba(22,163,74,0.15);
  --red:#DC2626;--red-d:rgba(220,38,38,0.15);
  --blue:#2563EB;--blue-d:rgba(37,99,235,0.15);
  --t1:#0F172A;--t2:#475569;--t3:#64748B;
  --mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;
  --r:16px;--rs:10px;--nav:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{width:100%;max-width:none;height:100dvh;margin:0 auto;position:relative;overflow:hidden}
/* now no maximum, calendar can expand to entire viewport */

/* ══ 頁面 ══════════════════════════════════════ */
.page{position:absolute;inset:0;bottom:var(--nav);overflow-y:auto;overflow-x:visible;
  padding:16px 16px 24px;opacity:0;transform:translateY(10px);
  pointer-events:none;transition:opacity .2s,transform .2s;-webkit-overflow-scrolling:touch}
.page.active{opacity:1;transform:translateY(0);pointer-events:all}
.page::-webkit-scrollbar{display:none}

/* ══ 底部導覽 ══════════════════════════════════ */
#nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
  height:var(--nav);display:flex;align-items:center;justify-content:space-around;
  background:var(--sf);border-top:1px solid var(--border);z-index:90;
  padding:0 4px env(safe-area-inset-bottom)}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  padding:6px 12px;border-radius:var(--rs);transition:.15s;
  -webkit-tap-highlight-color:transparent;min-width:48px}
.ni .ic{font-size:20px;transition:transform .15s}
.ni .lb{font-size:10px;color:var(--t3);letter-spacing:.4px;transition:color .15s}
.nav-icon{width:22px;height:22px;object-fit:contain;}
.ni.active .lb{color:var(--acc);font-weight:700}
.ni.active .ic{transform:scale(1.1)}
.nav-plus{width:48px;height:48px;border-radius:50%;background:var(--acc);
  display:flex;align-items:center;justify-content:center;font-size:24px;color:#0a1a10;
  cursor:pointer;box-shadow:0 4px 18px rgba(46,204,143,.4);transition:.15s;
  -webkit-tap-highlight-color:transparent;margin-bottom:6px;flex-shrink:0}
.nav-plus:active{transform:scale(.9)}

/* ══ Overlay（全螢幕滑入）════════════════════ */
.overlay-page{position:fixed;inset:0;max-width:430px;margin:0 auto;background:var(--bg);
  z-index:200;display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden;
  pointer-events:none /* allow clicks through when hidden */}
.overlay-page.show{transform:translateY(0);pointer-events:auto}  
.top-bar{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--sf)}
.top-bar h2{font-size:16px;font-weight:600}
.bar-btn{width:34px;height:34px;border-radius:50%;background:var(--sf2);
  border:1px solid var(--border);color:var(--t2);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;
  -webkit-tap-highlight-color:transparent}
.bar-btn.confirm{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.bar-btn.confirm:active{background:var(--acc);color:#0a1a10}
.overlay-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.overlay-body::-webkit-scrollbar{display:none}

/* ══ 型別 Tab ══════════════════════════════════ */
.type-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--sf2);padding:4px;border-radius:var(--rs)}
.type-tab{flex:1;padding:8px 0;border-radius:7px;border:none;background:transparent;
  color:var(--t2);font-size:13px;font-family:var(--sans);cursor:pointer;transition:.15s;
  -webkit-tap-highlight-color:transparent}
.type-tab.on{font-weight:600}
.type-tab.on.expense{background:var(--red);color:#fff}
.type-tab.on.piggy{background:#F59E0B;color:#fff}
.type-tab.on.income{background:var(--acc);color:#0a1a10}
.type-tab.on.transfer{background:var(--blue);color:#0a1a25}
.type-tab.on.adjust{background:#9B5DE5;color:#fff}

/* ══ 新增記錄 表單 ═════════════════════════════ */
.total-disp{text-align:center;padding:12px 0 4px}
.total-disp .lbl{font-size:11px;color:var(--t3);letter-spacing:.8px;margin-bottom:4px}
.total-disp .val{font-family:var(--mono);font-size:38px;font-weight:500;letter-spacing:-2px;color:var(--t1)}
.total-disp .val .cur{font-size:16px;color:var(--t2);margin-right:3px}
/* 分類快選（移到 items 前面）*/
.cat-section{margin-bottom:14px}
.cat-lbl{font-size:11px;color:var(--t3);letter-spacing:.8px;margin-bottom:8px}
.cat-grid{display:flex;flex-wrap:wrap;gap:7px}
.cat-chip{padding:7px 12px;border-radius:20px;border:1px solid var(--border);
  background:var(--sf2);color:var(--t2);font-size:12px;cursor:pointer;transition:.15s;
  -webkit-tap-highlight-color:transparent;white-space:nowrap}
.cat-chip.on{border-color:var(--acc);background:rgba(22,163,74,0.18);color:var(--acc);box-shadow:0 0 0 1px var(--acc);}
.transfer-type .cat-chip.on{background:rgba(37,99,235,0.35);border:2px solid var(--blue);color:var(--blue);box-shadow:none;transform:scale(1.1);font-weight:700;}
.cat-chip.on-expense{border-color:var(--red);background:var(--red-d);color:var(--red)}
.cat-chip.on-income{border-color:var(--acc);background:var(--acc-d);color:var(--acc)}
.cat-chip.on-transfer{border-color:var(--blue);background:var(--blue-d);color:var(--blue)}
/* 記帳項目 */
.items-section{margin-bottom:12px}
.items-lbl{font-size:11px;color:var(--t3);letter-spacing:.8px;margin-bottom:8px}
.item-row{display:flex;gap:8px;align-items:center;padding:10px 12px;
  background:var(--sf);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px}
.item-note-tags-row{margin-bottom:8px;margin-left:8px;}
.item-note-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.item-row .cat-btn{background:var(--sf2);border:1px solid var(--border);border-radius:var(--rs);padding:6px 8px;cursor:pointer;text-align:left;}
.item-row input{background:transparent;border:none;outline:none;
  font-family:var(--mono);font-size:13px;color:var(--t1);text-align:right;width:100%}
.item-del{width:24px;height:24px;border-radius:50%;background:var(--red-d);border:none;
  color:var(--red);font-size:13px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.add-item-btn{width:100%;padding:11px;background:var(--sf2);border:1px dashed var(--border);
  border-radius:var(--rs);color:var(--t2);font-size:13px;cursor:pointer;
  font-family:var(--sans);transition:.15s;-webkit-tap-highlight-color:transparent;margin-bottom:12px}
.add-item-btn:active{background:var(--sf)}
/* 備註（在 新增一項 下面）*/
.note-row{margin-bottom:14px}
/* 折疊資訊區 */
.info-section{background:var(--sf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.info-toggle{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.info-toggle span{font-size:13px;color:var(--t2)}
.info-toggle .arrow{font-size:11px;color:var(--t3);transition:transform .2s}
.info-toggle.open .arrow{transform:rotate(180deg)}
.info-body{border-top:1px solid var(--border);padding:12px 14px;display:none;flex-direction:column;gap:10px}
.info-body.open{display:flex}
/* 表單元件 */
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;color:var(--t3);letter-spacing:.7px}
.fsel,.finp{width:100%;padding:10px 12px;background:var(--sf2);border:1px solid var(--border);
  border-radius:var(--rs);color:var(--t1);font-size:14px;font-family:var(--sans);
  outline:none;appearance:none;transition:border-color .15s}
.fsel:focus,.finp:focus{border-color:var(--acc)}
.fsel option{background:var(--sf2)}

/* ══ 帳戶總覽頁 ════════════════════════════════ */
.pg-title-center{font-size:20px;font-weight:700;text-align:center;margin-bottom:20px}
/* 分組折疊卡片 */
.grp-card{background:var(--sf);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;margin-bottom:10px}
.grp-header{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.12s}
.grp-header:active{background:var(--sf2)}
.grp-title{font-size:13px;font-weight:600;color:var(--blue)}
.grp-total{font-family:var(--mono);font-size:13px;color:var(--t2)}
.grp-arrow{font-size:11px;color:var(--t3);transition:transform .2s;margin-left:8px}
.grp-arrow.open{transform:rotate(180deg)}
.grp-body{display:none;border-top:1px solid var(--border)}
.grp-body.open{display:block}
.acc-row{display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--border)}
.acc-row:last-child{border-bottom:none}
.acc-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex-shrink:0}
.acc-icon{width:24px;height:24px;object-fit:cover;border-radius:6px;flex-shrink:0;border:2px solid transparent}
.acc-name{flex:1;font-size:13px}
.acc-bal{font-family:var(--mono);font-size:13px;color:var(--t2)}
.empty-grp{padding:14px 16px;font-size:13px;color:var(--t3)}

/* ══ 首頁 ══════════════════════════════════════ */
/* 月導航列 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav-center{display:flex;flex-direction:column;align-items:center;flex:1}
.cal-nav span{font-size:12px;color:var(--t2)}

/* 選中日期樣式在日曆導航列內 */
.sel-date-bar{margin-top:4px}


.mbtn{width:30px;height:30px;border-radius:50%;background:var(--sf2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;
  color:var(--t2);-webkit-tap-highlight-color:transparent}
.mbtn:active{background:var(--sf)}
/* 選中日期大標（週列上方置中）*/
.sel-date-bar{text-align:center;margin-bottom:10px}
.sel-date-bar .sd-big{font-size:17px;font-weight:700;letter-spacing:-.3px}
.sel-date-bar .sd-dow{font-size:12px;color:var(--t2);margin-top:2px}
/* 月曆格樣式 */
.month-grid{display:flex;flex-direction:column;gap:1px;margin-bottom:8px;transform:translateY(-4px);max-width:none;width:100vw;margin:0 auto;justify-content:center}
/* change the max-width above to make the calendar wider or narrower; the numbers inside
   will scale automatically because we use percentage-based width/height on .month-cell. */
.month-row{display:grid;grid-template-columns:repeat(7,1fr)}
.month-cell{padding:4px;text-align:center;font-size:12px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;width:calc(100%/7);height:calc(100%/7);min-width:40px;min-height:40px}
.month-cell.today{background:var(--blue);color:#fff;border-radius:50%}
.month-cell.sel{background:var(--blue-d);color:var(--blue);border-radius:50%}
.month-cell.month-dow{font-size:11px;color:var(--blue);cursor:default}  
/* 小記錄點 */
.rec-dot-small{width:5px;height:5px;border-radius:50%;background:var(--acc);position:absolute;top:2px;left:2px}

.wday{display:flex;align-items:center;justify-content:center}
.wday-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;position:relative;cursor:pointer;transition:.12s;
  -webkit-tap-highlight-color:transparent}
.wday-num:active{background:var(--sf2)}
.wday-num.today{background:var(--acc-d);color:var(--acc);font-weight:700}
.wday-num.sel{background:var(--acc);color:#0a1a10;font-weight:700}
.wday-num.has::after{content:'';width:3px;height:3px;border-radius:50%;background:var(--acc);
  position:absolute;bottom:1px;left:50%;transform:translateX(-50%)}
.wday-num.sel.has::after{background:#0a1a10}
.wday-num.sun{color:var(--red)} .wday-num.sat{color:var(--blue)}
/* 流水帳 */
.sec-title{font-size:11px;color:var(--t3);letter-spacing:1px;margin-bottom:8px}
.rec-list{display:flex;flex-direction:column;gap:14px}
.rec-item{background:var(--sf);border:1px solid var(--border);border-radius:var(--rs);
  padding:11px 12px;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent}
.rec-item:active{background:var(--sf2)}
.rec-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rec-type-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rec-item.has-icon .rec-type-dot{display:none}
.rec-transfer-tag{display:inline-block;padding:2px 6px;border-radius:999px;font-size:11px;color:#fff;margin-right:6px;}
.rec-cat-icon{width:32px;height:32px;object-fit:cover;border-radius:50%;margin-right:10px;flex-shrink:0;border:2px solid transparent}
.cat-icon{width:18px;height:18px;object-fit:cover;border-radius:4px;margin-right:6px;vertical-align:middle;}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{font-size:11px;color:var(--t3);margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.rec-sub-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec-sub-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rec-sub-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:999px;background:rgba(15,23,42,0.06);color:var(--t2);font-size:11px;white-space:nowrap;}
.rec-sub-chip strong{color:var(--t1)}
.rec-amt{font-family:var(--mono);font-size:14px;flex-shrink:0}
.rec-amt.r{color:var(--red)} .rec-amt.g{color:var(--acc)} .rec-amt.b{color:var(--blue)} .rec-amt.a{color:#9B5DE5}
.empty-tip{text-align:center;padding:28px 0;color:var(--t3);font-size:13px;line-height:2}

/* ══ 報表頁 ════════════════════════════════════ */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav h2{font-size:15px;font-weight:500}
.rpt-card{background:var(--sf);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.rpt-tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--sf2);padding:4px;border-radius:var(--rs)}
.rpt-tab{flex:1;padding:7px 0;border-radius:7px;border:none;background:transparent;
  color:var(--t2);font-size:12px;font-family:var(--sans);cursor:pointer;transition:.15s}
.rpt-tab.on{background:var(--sf);color:var(--t1);font-weight:500}
/* 水平長條圖（總覽）*/
.hbar-row{margin-bottom:14px}
.hbar-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.hbar-label .hl-name{font-size:12px;color:var(--t2)}
.hbar-label .hl-val{font-family:var(--mono);font-size:14px}
.hbar-track{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden}
.hbar-fill{height:100%;border-radius:4px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.rpt-divider{height:1px;background:var(--border);margin:14px 0}
.rpt-total{display:flex;justify-content:space-between;align-items:center;padding-top:2px}
.rpt-total .rt-lbl{font-size:13px;color:var(--t2)}
.rpt-total .rt-val{font-family:var(--mono);font-size:18px;font-weight:500}
/* 類別條 */
.bar-item{margin-bottom:10px}
.bar-hdr{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.bar-track-sm{height:4px;background:var(--sf2);border-radius:2px;overflow:hidden}
.bar-fill-sm{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.cat-table-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.08);font-size:13px}
.cat-table-dot{width:10px;height:10px;border-radius:50%;margin-right:8px;flex-shrink:0}
.cat-table-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-table-val{font-family:var(--mono);margin-left:10px;white-space:nowrap}
/* 商家列 */
.mer-row{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.mer-row:last-child{border-bottom:none}
.mer-row .ms{font-size:11px;color:var(--t3)} .mer-row .mv{font-family:var(--mono);color:var(--red)}
/* 圓餅圖（移到類別頁）*/
.chart-wrap{position:relative;width:260px;height:260px;margin:0 auto 14px;overflow:visible}
.chart-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none}
.chart-center .cl{font-size:10px;color:var(--t3)}
.chart-center .cv{font-family:var(--mono);font-size:15px;color:var(--t1)}
.cat-toggle{display:flex;gap:8px;margin-bottom:10px;justify-content:center}
.cat-toggle-btn{flex:1;padding:6px 8px;border-radius:999px;border:1px solid rgba(0,0,0,0.1);background:var(--sf2);color:var(--t2);font-size:12px;cursor:pointer;transition:.2s}
.cat-toggle-btn.on{background:var(--acc);color:#0a1a10;border-color:var(--acc);box-shadow:0 2px 8px rgba(22,163,74,0.25)}
.transfer-type{display:flex;gap:8px;margin:10px 0 6px;justify-content:center}
.transfer-type .cat-chip{padding:8px 12px;border-radius:999px;transition:.2s;}
/* ══ 功能頁 ════════════════════════════════════ */
.fn-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:20px}
.set-sec{margin-bottom:20px}
.set-sec h3{font-size:11px;color:var(--t3);letter-spacing:1px;margin-bottom:8px}
.set-list{background:var(--sf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.set-row{display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--border);font-size:14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:.12s}
.set-row:last-child{border-bottom:none}
.set-row:active{background:var(--sf2)}
.set-row .sn{flex:1} .set-row .arr{color:var(--t3);font-size:12px}
/* 設定子頁 */
.sub-item-row{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid var(--border);font-size:14px}
.sub-item-row:last-child{border-bottom:none}
.sub-item-row .sn{flex:1}
.delbtn{width:26px;height:26px;border-radius:50%;background:var(--red-d);border:none;
  color:var(--red);font-size:13px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.sortbtn{width:26px;height:26px;border-radius:50%;background:var(--sf2);border:1px solid var(--border);
  color:var(--t2);font-size:12px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.sortbtn:hover{background:var(--sf)}
.editbtn{width:26px;height:26px;border-radius:50%;background:rgba(37,99,235,0.08);border:1px solid rgba(37,99,235,0.3);
  color:var(--blue);font-size:12px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.editbtn:hover{background:rgba(37,99,235,0.15)}
/* 帳戶子頁：分組折疊 */
.sub-grp{margin-bottom:8px}
.sub-grp-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--sf2);border-radius:var(--rs);cursor:pointer;
  -webkit-tap-highlight-color:transparent;margin-bottom:4px}
.sub-grp-hdr span{font-size:13px;font-weight:500}
.sub-grp-hdr .sg-arrow{font-size:10px;color:var(--t3);transition:transform .2s}
.sub-grp-hdr.open .sg-arrow{transform:rotate(180deg)}
.sub-grp-body{display:none;background:var(--sf);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden}
.sub-grp-body.open{display:block}

/* ══ 新增帳戶 mini overlay ══════════════════════ */
#add-acc-overlay{position:fixed;inset:0;max-width:430px;margin:0 auto;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:300;
  display:none;align-items:flex-end;justify-content:center;
  pointer-events:none}
#add-acc-overlay.show{display:flex;pointer-events:auto}  
#add-acc-box{background:var(--sf);border-radius:20px 20px 0 0;border-top:1px solid var(--border);
  padding:20px 20px 36px;width:100%}
#add-acc-box h3{font-size:15px;font-weight:600;margin-bottom:16px}

#add-cat-overlay{position:fixed;inset:0;max-width:430px;margin:0 auto;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:300;
  display:none;align-items:flex-end;justify-content:center;
  pointer-events:none}
#add-cat-overlay.show{display:flex;pointer-events:auto}  
#add-cat-box{background:var(--sf);border-radius:20px 20px 0 0;border-top:1px solid var(--border);
  padding:20px 20px 36px;width:100%}
#add-cat-box h3{font-size:15px;font-weight:600;margin-bottom:16px}
#ncat-palette{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:8px 0}
#ncat-palette .pal{width:100%;aspect-ratio:1;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:.15s}
#ncat-palette .pal:hover{transform:scale(1.15);border-color:var(--t1)}
#ncat-color{width:100%;margin-top:4px}#add-acc-box .fg{margin-bottom:12px}  
.acc-btns{display:flex;gap:10px;margin-top:4px}
.acc-btn{flex:1;padding:12px;border-radius:var(--rs);border:1px solid var(--border);
  background:var(--sf2);color:var(--t2);font-size:14px;font-family:var(--sans);cursor:pointer;transition:.15s}
.acc-btn.ok{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.acc-btn:active{opacity:.7}

/* ══ 記錄詳情 mini overlay (same style as add-account) ══════════════════════ */
#detail-page{position:fixed;inset:0;max-width:430px;margin:0 auto;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:300;
  display:none;align-items:flex-end;justify-content:center;
  pointer-events:none}
#detail-page.show{display:flex;pointer-events:auto}
#detail-box{background:var(--sf);border-radius:20px 20px 0 0;border-top:1px solid var(--border);
  padding:20px 20px 36px;width:100%}
#detail-box h3{font-size:15px;font-weight:600;margin-bottom:16px}
#detail-box h2{font-size:15px;font-weight:600;margin-bottom:16px;flex:1;text-align:center}
/* detail info styles */
.detail-title{font-size:18px;font-weight:600;text-align:left;margin-bottom:8px}
.detail-amount{font-size:16px;text-align:right;margin-bottom:8px}
.detail-infobox{border:1px solid var(--border);padding:8px;border-radius:6px;margin-bottom:8px;font-size:14px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:14px}
.detail-grid .row-label{font-weight:500}
/* tag style for item categories */
.tag{display:inline-block;background:var(--sf2);color:var(--t2);font-size:13px;padding:2px 6px;border-radius:4px;margin-right:4px}
.note-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note-tag{padding:6px 10px;border:1px solid rgba(15,23,42,.15);border-radius:999px;background:var(--sf2);color:var(--t2);font-size:12px;cursor:pointer;transition:.15s}
.note-tag:hover{background:rgba(22,163,74,.08);border-color:rgba(22,163,74,.4)}
#detail-box hr{margin:12px 0}


/* ══ Toast ══════════════════════════════════════ */
#toast{position:fixed;bottom:calc(var(--nav)+12px);left:50%;
  transform:translateX(-50%) translateY(12px);background:var(--sf2);color:var(--t1);
  padding:9px 18px;border-radius:20px;font-size:13px;border:1px solid var(--border);
  opacity:0;transition:.25s;z-index:99999;white-space:pre-wrap;max-width:80vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.acc-summary{padding:12px;margin-bottom:8px}
.acc-summary-header{display:flex;align-items:center;justify-content:space-between}
.acc-summary-left{display:flex;flex-direction:column;justify-content:center;min-width:72px}
.acc-summary-title{font-size:12px;color:var(--t1);font-weight:500}
.acc-summary-currency{font-size:18px;color:var(--t1);font-weight:700;line-height:1.1;text-align:left;margin-top:2px}
.acc-summary-amount{flex:1;font-family:var(--mono);font-size:44px;font-weight:800;color:var(--t1);text-align:center;line-height:1.1}
.acc-summary-right{width:72px}
.acc-summary-break{display:flex;justify-content:center;gap:16px;font-size:13px;margin-top:8px}
.acc-summary-break span{color:var(--t2)}
.acc-summary-break .liab{color:var(--red)}

.acc-summary-amount{color:#16A34A!important;text-align:center!important;}
.acc-icon,.rec-cat-icon{border:none!important;}

/* === 累積修改 CSS === */
.acc-summary-left{padding-left:30px!important;}
.acc-summary-amount{margin-right:80px!important;}
.cal-nav{margin-bottom:4px!important;}
.sel-date-bar{margin-bottom:4px!important;}
.sel-date-bar .sd-big{font-size:15px!important;}
.sel-date-bar .sd-dow{font-size:11px!important;}
.month-grid{gap:0!important;margin-bottom:6px!important;}
.month-cell{min-width:32px!important;min-height:32px!important;padding:2px!important;}
.month-cell.month-dow{font-weight:700!important;}
.rec-dot-small{width:4px!important;height:4px!important;top:1px!important;left:1px!important;}
.rec-item{padding:10px 12px!important;display:flex!important;align-items:flex-start!important;gap:8px!important;background:var(--sf)!important;border:1px solid var(--border)!important;border-radius:var(--rs)!important;box-shadow:none!important;}
.rec-dot,.rec-type-dot{width:8px!important;height:8px!important;border-radius:50%!important;flex-shrink:0!important;margin-top:4px!important;}
.rec-cat-icon{width:36px!important;height:36px!important;object-fit:cover!important;border-radius:8px!important;flex-shrink:0!important;border:none!important;}
.rec-info{flex:1!important;min-width:0!important;}
.rec-name{font-size:13px!important;font-weight:500!important;display:flex!important;align-items:center!important;flex-wrap:wrap!important;gap:4px!important;line-height:1.4!important;white-space:normal!important;overflow:visible!important;}
.rec-inline-chip{display:inline-flex;align-items:center;padding:1px 6px;border-radius:999px;background:rgba(15,23,42,0.07);color:var(--t3);font-size:10px;white-space:nowrap;}
.rec-note{font-size:11px;color:var(--t3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;min-width:64px;}
.rec-amt{font-family:var(--mono)!important;font-size:14px!important;white-space:nowrap!important;flex-shrink:0!important;}
.rec-tag-row{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;}
.rec-tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;font-size:10px;white-space:nowrap;font-weight:500;}
.rec-tag.acc{background:rgba(37,99,235,0.10);color:var(--blue);}
.rec-tag.exp{background:rgba(22,163,74,0.10);color:var(--acc);}
.chart-wrap{position:relative!important;width:240px!important;height:240px!important;margin:0 auto 14px!important;overflow:visible!important;}
.rpt-card{overflow:visible!important;}
.rpt-section-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px;}
/* 日期 badge */
.date-badge{display:flex;align-items:center;justify-content:space-between;background:var(--acc-d);border:1px solid var(--acc);border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.date-badge .dbl{font-size:10px;color:var(--acc);margin-bottom:2px;}
.date-badge .dbv{font-size:15px;font-weight:700;color:var(--acc);}
.date-badge .dbt{font-size:13px;font-weight:500;color:var(--acc);}
/* 自訂確認對話框 */
#custom-confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:none;align-items:center;justify-content:center;padding:24px}
#custom-confirm-overlay.show{display:flex}
#custom-confirm-box{background:var(--sf);border-radius:16px;padding:24px 20px 16px;width:100%;max-width:320px}
#custom-confirm-msg{font-size:15px;color:var(--t1);margin-bottom:20px;line-height:1.5}
#custom-confirm-msg strong{color:var(--red)}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:12px;border-radius:var(--rs);border:none;font-size:14px;font-family:var(--sans);cursor:pointer;font-weight:500}
.confirm-btn-cancel{background:var(--sf2);color:var(--t2)}
.confirm-btn-ok{background:var(--red);color:#fff}

/* 行內確認刪除 */
.row-del-confirm{display:flex;align-items:center;gap:6px;margin-left:auto}
.row-del-btn{width:32px;height:32px;border-radius:50%;background:var(--red-d);border:none;color:var(--red);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.row-confirm-yes{padding:3px 10px;border-radius:999px;background:var(--red);color:#fff;border:none;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.row-confirm-no{padding:3px 10px;border-radius:999px;background:var(--sf2);color:var(--t2);border:1px solid var(--border);font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="app">

<!-- ══ 帳戶總覽 ══════════════════════════════════ -->
<section class="page" id="page-accounts">
  <div class="pg-title-center">帳戶總覽</div>
  <div id="acc-summary" class="acc-summary"></div>
  <!-- 按分組折疊顯示帳戶 -->
  <div id="acc-groups"></div>
</section>

<!-- ══ 首頁 ══════════════════════════════════════ -->
<section class="page active" id="page-home" style="display:flex;flex-direction:column;overflow:hidden;padding:0">
  <!-- 固定上半：日曆區 -->
  <div id="home-header" style="flex-shrink:0;padding:12px 16px 6px;background:var(--bg);">
    <div class="cal-nav">
      <div class="mbtn" id="cal-prev">◀</div>
      <div class="cal-nav-center">
        <div class="sel-date-bar">
          <div class="sd-big" id="sd-big"></div>
          <div class="sd-dow" id="sd-dow"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <div class="mbtn" id="cal-next">▶</div>
        <button id="search-btn" onclick="openSearch()" style="width:30px;height:30px;border-radius:50%;background:var(--sf2);border:1px solid var(--border);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;padding:0;overflow:hidden;"><img src="/icon/搜尋.png" width="30" height="30" style="object-fit:contain;"></button>
      </div>
    </div>
    <!-- 月曆格 -->
    <div class="month-grid" id="month-grid"></div>
    <!-- 流水帳標題 -->
    <div class="sec-title" style="margin-bottom:6px">
      <span id="day-label">今日記錄</span>
      <span id="acc-filter" style="margin-left:8px;color:var(--t3);font-size:14px;cursor:pointer;display:none"></span>
    </div>
  </div>
  <!-- 可滑動下半：記錄列表 -->
  <div id="rec-list" class="rec-list" style="flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:4px;"></div>
</section>

<!-- ══ 報表 ══════════════════════════════════════ -->
<section class="page" id="page-report">
  <div class="pg-title-center">報表</div>
  <div class="rpt-tabs" id="rpt-big-tabs" style="margin-bottom:10px">
    <button class="rpt-tab on" data-bigv="monthly">每月報表</button>
    <button class="rpt-tab" data-bigv="yearly">年度報表</button>
  </div>
  <div id="rpt-monthly">
    <div class="month-nav">
      <div class="mbtn" id="rpt-prev">◀</div>
      <h2 id="rpt-label"></h2>
      <div class="mbtn" id="rpt-next">▶</div>
    </div>
    <div class="rpt-tabs" id="rpt-small-tabs">
      <button class="rpt-tab on" data-rv="overview">總覽</button>
      <button class="rpt-tab" data-rv="cat">類別</button>
      <button class="rpt-tab" data-rv="merchant">商家</button>
      <button class="rpt-tab" data-rv="trend">趨勢</button>
    </div>
    <div id="rv-trend" class="rpt-card" style="display:none"></div>
    <div id="rv-overview-wrap">
      <div id="rv-overview" class="rpt-card"></div>
      <div id="rv-ov-cat" class="rpt-card"></div>
      <div id="rv-ov-top3" class="rpt-card"></div>
      <div id="rv-ov-mer" class="rpt-card"></div>
    </div>
    <div id="rv-cat" class="rpt-card" style="display:none"></div>
    <div id="rv-merchant" class="rpt-card" style="display:none"></div>
  </div>
  <div id="rpt-yearly" style="display:none">
    <div class="month-nav">
      <div class="mbtn" id="rpt-yr-prev">◀</div>
      <h2 id="rpt-yr-label"></h2>
      <div class="mbtn" id="rpt-yr-next">▶</div>
    </div>
    <div id="rv-yearly" class="rpt-card"></div>
  </div>
</section>

<!-- ══ 功能 ══════════════════════════════════════ -->
<section class="page" id="page-settings">
  <div class="fn-title">更多功能</div>

  <div class="set-sec">
    <h3>備份 / 還原</h3>
    <div class="set-list">
      <div class="set-row" onclick="doBackup()"><span class="sn">本機備份</span><span class="arr">↓</span></div>
      <div class="set-row" onclick="doRestore()"><span class="sn">還原備份</span><span class="arr">↑</span></div>
      <div class="set-row" onclick="doClearRecords()"><span class="sn" style="color:var(--red)">清除所有紀錄（保留設定）</span><span class="arr" style="color:var(--red)">!</span></div>
      <div class="set-row" onclick="doReset()"><span class="sn" style="color:var(--red)">完全重置（清除所有資料）</span><span class="arr" style="color:var(--red)">!</span></div>
    </div>
  </div>

  <div class="set-sec">
    <h3>設定</h3>
    <div class="set-list">
      <div class="set-row" onclick="openSubPage('categories')"><span class="sn">類別</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('merchants')"><span class="sn">商家</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('experts')"><span class="sn">專案</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('note_tags')"><span class="sn">備註標籤</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('account_groups')"><span class="sn">帳戶分組</span><span class="arr">›</span></div>
      <div class="set-row" onclick="openSubPage('accounts')"><span class="sn">帳戶</span><span class="arr">›</span></div>
    </div>
  </div>
  <div class="set-sec">
    <h3>進階功能</h3>
    <div class="set-list">
      <div class="set-row" onclick="openAdvPage('piggy')">
        <span class="sn" style="display:flex;align-items:center;gap:10px">
          <img src="/icon/存錢筒.png" width="24" height="24" style="object-fit:contain;flex-shrink:0;">
          存錢筒
        </span><span class="arr">›</span>
      </div>
      <div class="set-row" onclick="openAdvPage('budget')">
        <span class="sn" style="display:flex;align-items:center;gap:10px">
          <img src="/icon/預算.png" width="24" height="24" style="object-fit:contain;flex-shrink:0;">
          預算管理
        </span><span class="arr">›</span>
      </div>
      <div class="set-row" onclick="openAdvPage('recurring')">
        <span class="sn" style="display:flex;align-items:center;gap:10px">
          <img src="/icon/安排.png" width="24" height="24" style="object-fit:contain;flex-shrink:0;">
          固定支出／收入
        </span><span class="arr">›</span>
      </div>
    </div>
  </div>

</section>

<!-- ══ 底部導覽 ════════════════════════════════ -->
<nav id="nav">
  <div class="ni" data-pg="accounts"><img class="nav-icon" src="/guide/帳戶.png" alt="帳戶"><span class="lb">帳戶</span></div>
  <div class="ni active" data-pg="home"><img class="nav-icon" src="/guide/首頁.png" alt="首頁"><span class="lb">首頁</span></div>
  <div class="nav-plus" id="nav-plus">＋</div>
  <div class="ni" data-pg="report"><img class="nav-icon" src="/guide/報表.png" alt="報表"><span class="lb">報表</span></div>
  <div class="ni" data-pg="settings"><img class="nav-icon" src="/guide/功能.png" alt="功能"><span class="lb">功能</span></div>
</nav>
</div>

<!-- ══ 新增記錄 Overlay ═══════════════════════ -->
<div class="overlay-page" id="add-page">
  <div class="top-bar">
    <button class="bar-btn" id="add-cancel">✕</button>
    <h2>新增記錄</h2>
    <button class="bar-btn confirm" id="add-confirm">✓</button>
  </div>
  <div class="overlay-body">
    <input type="date" id="f-date" style="position:fixed;left:-9999px;opacity:0;pointer-events:none;">
    <input type="time" id="f-time" style="position:fixed;left:-9999px;opacity:0;pointer-events:none;">
    <!-- 支出/收入/轉帳 -->
    <div class="type-tabs">
      <button class="type-tab on expense" data-t="expense">支出</button>
      <button class="type-tab" data-t="income">收入</button>
      <button class="type-tab" data-t="transfer">轉帳</button>
      <button class="type-tab" data-t="adjust">調整</button>
      <button class="type-tab" data-t="piggy">存錢筒</button>
    </div>
    <!-- 存錢筒模式：選擇存錢筒 + 金額 -->
    <div id="piggy-type-section" style="display:none">
      <div class="cat-lbl">選擇存錢筒</div>
      <div id="piggy-type-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;"></div>
    </div>
    <!-- 轉帳類型（置中）-->
    <div class="transfer-type" id="transfer-type" style="display:none;text-align:center">
      <div class="cat-lbl" style="text-align:center">轉帳類別</div>
      <div class="cat-grid" id="transfer-type-grid" style="justify-content:center"></div>
    </div>
    <!-- 總金額（存錢筒時隱藏）-->
    <div class="total-disp" id="total-disp">
      <div class="lbl">總金額（自動加總）</div>
      <div class="val"><span class="cur">NT$</span><span id="total-val">0</span></div>
    </div>
    <!-- 記帳項目（每項可設定分類） -->
    <div class="cat-section" id="cat-section" style="display:none">
      <div class="cat-lbl">分類</div>
      <div class="cat-grid" id="modal-cat-grid"></div>
    </div>
    <!-- 記帳項目 -->
    <div class="items-section">
      <div class="items-lbl">記帳項目</div>
      <div id="items-list"></div>
      <button class="add-item-btn" id="add-item-btn">＋ 新增一項</button>
    </div>
    <!-- 日期時間 -->
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <div class="fg" style="flex:1">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">日期</label>
        <input type="date" class="finp" id="f-date-vis" oninput="document.getElementById('f-date').value=this.value;syncDateBadge(this.value,document.getElementById('f-time-vis').value)">
      </div>
      <div class="fg" style="flex:1">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">時間</label>
        <input type="time" class="finp" id="f-time-vis" oninput="document.getElementById('f-time').value=this.value;syncDateBadge(document.getElementById('f-date-vis').value,this.value)">
      </div>
    </div>
    <!-- 帳戶（支出/收入/調整 standalone，轉帳/存錢筒隱藏）-->
    <div id="standalone-acc" style="margin-bottom:14px;display:none">
      <div class="fg">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">帳戶</label>
        <select class="fsel" id="f-acc"></select>
      </div>
    </div>
    <!-- 商家/收入來源（支出/收入 standalone）-->
    <div id="standalone-mer" style="margin-bottom:14px;display:none">
      <div class="fg">
        <label style="font-size:11px;color:var(--t3);letter-spacing:.7px">商家</label>
        <select class="fsel" id="f-mer"></select>

<script>
/* ══ 全域狀態 ══════════════════════════════════ */
/* ── 自訂確認框（取代 window.confirm）── */
function customConfirm(name){
  return new Promise(resolve=>{
    const ov=document.getElementById('custom-confirm-overlay');
    const msg=document.getElementById('custom-confirm-msg');
    msg.innerHTML='確定要「<strong>'+name+'</strong>」嗎？';
    ov.classList.add('show');
    const ok=document.getElementById('confirm-ok-btn');
    const cancel=document.getElementById('confirm-cancel-btn');
    function cleanup(result){
      ov.classList.remove('show');
      ok.removeEventListener('click',onOk);
      cancel.removeEventListener('click',onCancel);
      resolve(result);
    }
    function onOk(){cleanup(true);}
    function onCancel(){cleanup(false);}
    ok.addEventListener('click',onOk);
    cancel.addEventListener('click',onCancel);
    ov.addEventListener('click',e=>{if(e.target===ov)cleanup(false);},{once:true});
  });
}

const S={
  cfg:null,
  rptY:new Date().getFullYear(), rptM:new Date().getMonth()+1,
  selDate:(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})(  ),
  calY:new Date().getFullYear(), calM:new Date().getMonth()+1,
  monthRecs:[],
  addType:'expense', addItems:[], selCat:'',
  subPageKey:'', subCatType:'expense', subCatParent:null, // for nested categories
  subCatPath:[], // path stack for category depth control
  catParentForAdd:null, // temporary parent used by the add‑category overlay
  editingAccId:null, // current account being edited
  accFilter:'', // when set will filter home records
  pieChart:null, rptView:'overview',
  rptCatType:'expense', // expense | income
  transferCat:'deposit',
  subAccGroup:'', // 帳戶子頁目前顯示的分組 id
  newCatIcon:null,
  newAccIcon:null,
  accIconPreviewSize:40,
  catIconPreviewSize:32,
};

if(window.Chart && window.ChartDataLabels) Chart.register(ChartDataLabels);

// Draw simple leader lines from doughnut slices to labels
if(window.Chart){
  const leaderLinesPlugin={
    id:'leaderLines',
    afterDraw(chart){
      if(chart.config.type!=='doughnut') return;
      const ctx=chart.ctx;
      const meta=chart.getDatasetMeta(0);
      const dataset=chart.data.datasets[0];
      if(!meta?.data) return;
      ctx.save();
      ctx.strokeStyle='rgba(0,0,0,0.18)';
      ctx.lineWidth=1;
      meta.data.forEach((arc,idx)=>{
        const val=dataset.data[idx];
        if(!val) return;
        const angle=(arc.startAngle+arc.endAngle)/2;
        const r=arc.outerRadius;
        const x0=arc.x+Math.cos(angle)*(r+2);
        const y0=arc.y+Math.sin(angle)*(r+2);
        const x1=arc.x+Math.cos(angle)*(r+18);
        const y1=arc.y+Math.sin(angle)*(r+18);
        ctx.beginPath();
        ctx.moveTo(x0,y0);
        ctx.lineTo(x1,y1);
        ctx.stroke();
      });
      ctx.restore();
    }
  };
  Chart.register(leaderLinesPlugin);
}

/* ══ 工具 ══════════════════════════════════════ */
const fmt     = n=>Number(n).toLocaleString('zh-TW',{minimumFractionDigits:0});
const pad     = n=>String(n).padStart(2,'0');
const todayStr = () => {
  // use local date instead of UTC to avoid off-by-one due to timezone
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const nowTime = ()=>new Date().toTimeString().slice(0,5);
const DOW_CH  = ['日','一','二','三','四','五','六'];

function resolveIconUrl(icon){
  if(!icon) return '';
  if(icon.startsWith('data:')||icon.startsWith('http')||icon.startsWith('https')||icon.startsWith('/')) return icon;
  // allow specifying just the file name (e.g. "早餐.png") to load from /icon/
  if(icon.includes('/')||icon.includes('\\')){
    return encodeURI('/' + icon);
  }
  return encodeURI('/icon/' + icon);
}

function updateAccIconPreview(){
  const preview=document.getElementById('nacc-icon-preview');
  if(!preview) return;
  const sz = S.accIconPreviewSize || 40;
  preview.innerHTML = S.newAccIcon ? `<img src="${S.newAccIcon}" style="height:${sz}px;width:${sz}px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">` : '';
}
function updateCatIconPreview(){
  const preview=document.getElementById('ncat-icon-preview');
  if(!preview) return;
  const sz = S.catIconPreviewSize || 32;
  preview.innerHTML = S.newCatIcon ? `<img src="${S.newCatIcon}" style="height:${sz}px;width:${sz}px;object-fit:cover;border-radius:6px;border:1px solid var(--border)">` : '';
}

function toast(msg, duration){
  document.querySelectorAll('._toast_el').forEach(e=>e.remove());
  const el=document.createElement('div');
  el.className='_toast_el';
  el.textContent=msg;
  // 用 setAttribute style 確保 iOS 能正確套用
  el.setAttribute('style',
    'position:fixed !important;'
    +'bottom:80px !important;'
    +'left:50% !important;'
    +'transform:translateX(-50%) !important;'
    +'background:#1e293b !important;'
    +'color:#fff !important;'
    +'padding:12px 22px !important;'
    +'border-radius:28px !important;'
    +'font-size:14px !important;'
    +'font-weight:500 !important;'
    +'z-index:2147483647 !important;'
    +'max-width:85vw !important;'
    +'text-align:center !important;'
    +'box-shadow:0 6px 24px rgba(0,0,0,0.4) !important;'
    +'pointer-events:none !important;'
  );
  document.documentElement.appendChild(el); // 掛在 <html> 不是 <body>
  setTimeout(()=>{ el.remove(); }, duration||2500);
}

async function api(url,opts={}){
  const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});
  if(!r.ok){
    const text=await r.text();
    throw new Error(text||r.statusText);
  }
  return r.json();
}

async function ensureBuiltinIcons(){
  if(!S.builtinIcons){
    try{ S.builtinIcons = await api('/api/icons'); }catch(e){ S.builtinIcons=[]; }
  }
}

// 【需求 2】圖示選擇新視窗
// 圖示選擇（含分類 tab）
const ICON_CATS=['餐食、飲料','生活支出','交通','收入','帳戶','轉帳'];
let _iconCurCat=ICON_CATS[0]; // 預設選第一個分類
function openIconPicker(type){
  const el=document.getElementById('icon-picker');
  el.style.display='flex'; S._ipt=type; _iconCurCat=ICON_CATS[0];
  requestAnimationFrame(()=>el.classList.add('show'));
  renderIconCatTabs(); loadIconsForCat(_iconCurCat);
}
function renderIconCatTabs(){
  const bar=document.getElementById('icon-cat-tabs');
  if(!bar) return;
  bar.innerHTML=ICON_CATS.map(c=>
    `<button class="rpt-tab${c===_iconCurCat?' on':''}" onclick="switchIconCat('${c}')" style="padding:6px 10px;font-size:12px">${c}</button>`
  ).join('');
}
function switchIconCat(cat){
  _iconCurCat=cat;
  renderIconCatTabs();
  loadIconsForCat(cat);
}
function loadIconsForCat(cat){
  const list=document.getElementById('icon-list');
  list.innerHTML='<div style="padding:16px;color:var(--t3);font-size:13px;text-align:center">載入中...</div>';
  fetch('/api/icons'+(cat?'?category='+encodeURIComponent(cat):''))
    .then(r=>r.json()).then(files=>{
      if(!files.length){
        list.innerHTML='<div style="padding:24px;color:var(--t3);font-size:13px;text-align:center">此分類尚無圖示<br><small>/icon/'+(cat||'')+'/ 放置圖片</small></div>';
        return;
      }
      list.innerHTML=files.map(f=>
        `<div onclick="selectIcon('${f}')" style="text-align:center;cursor:pointer;padding:5px;border:1px solid var(--border);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;height:72px;">
          <img src="/icon/${f}" width="38" height="38" style="object-fit:contain;flex-shrink:0;">
          <div style="font-size:9px;color:var(--t3);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;">${f.split('/').pop().replace(/\.png$/i,'').replace(/\.jpg$/i,'').replace(/\.svg$/i,'')}</div>
        </div>`).join('');
    }).catch(()=>{
      list.innerHTML='<div style="padding:24px;color:var(--t3);font-size:13px;text-align:center">載入失敗</div>';
    });
}
function selectIcon(filename,type){
  const t=(typeof type==='string'&&type)?type:S._ipt;
  if(t==='category'){S.newCatIcon='/icon/'+filename;updateCatIconPreview();}
  else{S.newAccIcon='/icon/'+filename;updateAccIconPreview();}
  closeIconPicker(); toast('圖示已選取 ✓');
}
function closeIconPicker(){const el=document.getElementById('icon-picker');el.classList.remove('show');setTimeout(()=>{el.style.display='none';},300);}


/* ══ 頁面導覽 ══════════════════════════════════ */

const openOverlay  = id=>{

/* ══════════════════════════════════════════════
   帳戶總覽
══════════════════════════════════════════════ */
let ACC_GROUPS=[];

function renderAccounts(){
  const container=document.getElementById('acc-groups');
  const summary=document.getElementById('acc-summary');
  const accs=S.cfg.accounts||[];
  // overall total
  const posTotal = accs.reduce((s,a)=>s+Math.max(0,parseFloat(a.balance)||0),0);
  const negTotal = accs.reduce((s,a)=>s+Math.max(0,-(parseFloat(a.balance)||0)),0);
  const globalTotal = posTotal - negTotal;
  const totalColor = globalTotal>=0 ? '#22C55E' : 'var(--red)';
  summary.innerHTML = `
    <div class="acc-summary-header">
      <div class="acc-summary-left">
        <div class="acc-summary-title">總額</div>
        <div class="acc-summary-currency">TWD</div>
      </div>
      <div class="acc-summary-amount">${fmt(globalTotal)}</div>
    </div>
    <div class="acc-summary-break">
      <span>總資產 ${fmt(posTotal)}</span>
      <span class="liab">總負債 ${fmt(negTotal)}</span>
    </div>`;

  container.innerHTML='';

  const groups=ACC_GROUPS;
  const accountGroups = groups.map(grp=>({
    ...grp,
    accs: accs.filter(a=>a.group===grp.id)
  }));
  const ungrouped = accs.filter(a=>!groups.some(g=>g.id===a.group));
  if(ungrouped.length){
    accountGroups.push({id:'g_other',name:'其他',color:'#8B909A',accs:ungrouped});
  }

  accountGroups.forEach(grp=>{
    const grpAccs=grp.accs;
    const total=grpAccs.reduce((s,a)=>s+(parseFloat(a.balance)||0),0);

    const card=document.createElement('div'); card.className='grp-card';
    card.innerHTML=`

async function renderHome(){
  // load records for current calendar month
  const y=S.calY, m=S.calM;
  let url=`/api/records?year=${y}&month=${String(m).padStart(2,'0')}`;
  const rA=await api(url);
  S.monthRecs = rA;
  renderMonthCalendar();
  renderDateHeader();
  renderDayRecs(S.selDate);
}

function renderDayRecs(ds){
  const list=document.getElementById('rec-list');
  // sort ascending by time so earliest items appear at top
  let recs=S.monthRecs.filter(r=>r.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  // if an account filter is active, remove unrelated records
  if(S.accFilter){
    recs = recs.filter(r=>r.account===S.accFilter || r.to_account===S.accFilter);
  }
  if(!recs.length){ list.innerHTML='<div class="empty-tip">✨ 這天沒有記錄<br>點 ＋ 開始記帳</div>'; return; }
  list.innerHTML='';
  function flat(arr){return arr.reduce((a,c)=>{a.push(c);if(c.children) a=a.concat(flat(c.children));return a;},[]);}  
  const cats=[...flat(S.cfg.categories.expense||[]),...flat(S.cfg.categories.income||[]),...flat(S.cfg.categories.transfer||[])];
  recs.forEach(r=>{
    let catName=''; let catColor='#8B909A';
    let subText='';
    let acc; // will hold account object for non-transfer types
    if(r.type==='transfer'){
      const it=r.items[0]||{};
      const fromAcc=(S.cfg.accounts||[]).find(a=>a.id===it.from)||{name:it.from};
      const toAcc=(S.cfg.accounts||[]).find(a=>a.id===it.to)||{name:it.to};
      const transferCat=(S.cfg.categories?.transfer||[]).find(c=>c.id===r.category||c.id===it.category);
      const transferLabel = transferCat?`[${transferCat.name}] `:'';
      catColor = transferCat?.color||'#4CC9F0';
      catName=`${transferLabel}${fromAcc.name} → ${toAcc.name}`;
      subText=`${fmt(it.amount)}`;
    } else {
      if(r.category){
        const cc=cats.find(c=>c.id===r.category);
        if(cc){ catName=cc.name; catColor=cc.color||'#8B909A'; }
      }
      acc=(S.cfg.accounts||[]).find(a=>a.id===r.account);
      if(r.items && r.items.length){
        if(r.items.length>1){
          subText=`共 ${r.items.length} 項`;
        } else {
          const it=r.items[0];
          if(it.qty && it.price){
            subText=`${it.qty}×${fmt(it.price)}`;
          } else if(it.amount){
            subText=`${fmt(it.amount)}`;
          }
        }
      }
    }
    const row=document.createElement('div'); row.className='rec-row';
    row.innerHTML=`
      <div class="rec-l">
        <div class="rec-date">${r.time||''}</div>
        <div class="rec-cat" style="background:${catColor}">${catName}</div>
      </div>
      <div class="rec-r">
        <div class="rec-amt${r.type==='expense'?' exp':r.type==='income'?' inc':''}">NT$ ${fmt(r.amount)}</div>
        <div class="rec-sub">${subText}</div>
      </div>`;
    row.addEventListener('click',()=>openDetail(r));
    list.appendChild(row);
  });
}

function renderMonthCalendar(){
  const y=S.calY, m=S.calM;
  const first=new Date(y,m-1,1);
  const startDay=first.getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const grid=document.getElementById('month-grid');
  grid.innerHTML='';
  // header row
  const dowNames=['日','一','二','三','四','五','六'];
  const row1=document.createElement('div'); row1.className='month-row';
  dowNames.forEach(d=>{const c=document.createElement('div');c.className='month-cell month-dow';c.textContent=d;row1.appendChild(c);});
  grid.appendChild(row1);
  let day=1;
  for(let r=0;r<6;r++){
    const row=document.createElement('div'); row.className='month-row';
    for(let c=0;c<7;c++){
      const cell=document.createElement('div'); cell.className='month-cell';
      if(r===0 && c<startDay){cell.textContent='';}
      else if(day>daysInMonth){cell.textContent='';}
      else{
        cell.textContent=day;
        const ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        // 標註今日與當前選中
        if(ds===todayStr()) cell.classList.add('today');
        if(ds===S.selDate) cell.classList.add('sel');
        // 若該日有任何記錄，顯示左上角小點
        if(S.monthRecs.some(r=>r.date===ds)){
          const dot=document.createElement('div'); dot.className='rec-dot-small';
          cell.appendChild(dot);
        }
        cell.addEventListener('click',()=>{
          S.selDate=ds;
          // if user somehow clicks a date from another month (shouldn't happen since
          // out-of-month cells are blank) update the calendar state and fetch new records
          if(new Date(ds).getMonth()+1!==S.calM){
            S.calY=new Date(ds).getFullYear();
            S.calM=new Date(ds).getMonth()+1;
            renderHome(); // load records for the new month
            return;
          }
          renderDateHeader();
          renderDayRecs(ds);
          renderMonthCalendar();
        });
        day++;
      }
      row.appendChild(cell);
    }
    grid.appendChild(row);
  }
}

function renderDateHeader(){
  const d=new Date(S.selDate+'T00:00:00');
  const dow=DOW_CH[d.getDay()];
  document.getElementById('sd-big').textContent=
    `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  document.getElementById('sd-dow').textContent=`星期${dow}`;
  const td=todayStr();
  let label = S.selDate===td ? `今日記錄（${d.getMonth()+1}月${d.getDate()}日）` : `${d.getMonth()+1} 月 ${d.getDate()} 日記錄`;
  document.getElementById('day-label').textContent=label;
  const filtEl=document.getElementById('acc-filter');
  if(S.accFilter){
    const acc=S.cfg.accounts.find(a=>a.id===S.accFilter);
    if(acc){
      filtEl.textContent=`[${acc.name} ✕]`;
      filtEl.style.display='inline';
      filtEl.onclick=()=>{ S.accFilter=''; renderHome(); };
    } else {
      filtEl.style.display='none';
    }
  } else {
    filtEl.style.display='none';
  }
}

async function cleanupPiggyLogs() {
  const records = await api('/api/records');
  let piggies = advLoad('piggy');
  let changed = false;
  for (let i = 0; i < piggies.length; i++) {
    const p = piggies[i];
    const filtered = (p.logs || []).filter(l =>
      records.some(r => r.type === 'piggy' && (r.piggyName === p.name || r.note === p.name) && r.date === l.date)
    );
    if (filtered.length !== (p.logs || []).length) changed = true;
    p.logs = filtered;
    p.saved = filtered.reduce((sum, l) => sum + (l.amount || 0), 0);
  }
  if (changed) advSave('piggy', piggies);
}

async function delRec(id){
  if(!confirm('確定刪除？')) return;  
  try {
    // 1️⃣ 先取得記錄詳情（檢查是否為存錢筒類型）
    const allRecs = await api('/api/records');
    const rec = allRecs.find(r => r.id === id);    
    // 2️⃣ 如果是存錢筒記錄，同時刪除 localStorage 中的 logs
    if(rec && rec.type === 'piggy') {
      const piggies = advLoad('piggy');
      const piggyIdx = rec.piggyId;     
      if(piggies[piggyIdx]) {
        const pg = piggies[piggyIdx];
        // 從 logs 中移除該筆記錄
        if(pg.logs && pg.logs.length > 0) {
          pg.logs = pg.logs.filter(log => 
            !(log.date === rec.date && log.amount === rec.amount)
          );
          // 同時減少 saved 金額
          pg.saved = Math.max(0, (pg.saved || 0) - rec.amount);
          advSave('piggy', piggies);
        }
      }
    }    
    // 3️⃣ 刪除後端記錄
    await api(`/api/records/${id}`, {method: 'DELETE'});    
    toast('已刪除');
    await renderHome();
    await loadCfg();
    if(document.getElementById('page-accounts').classList.contains('active')) renderAccounts();
  } catch(err) {
    toast('刪除失敗：' + (err.message || err));
  }
}

function flattenCats(arr){return (arr||[]).reduce(function(a,c){a.push(c);if(c.children)a=a.concat(flattenCats(c.children));return a;},[]);}
async function renderReport(){
  var y=S.rptY,m=S.rptM;
  document.getElementById('rpt-label').textContent=y+' 年 '+m+' 月';
  var d=await api('/api/report?year='+y+'&month='+m);
  var pal=['#FF5F6D','#FF9A5C','#FFD166','#06D6A0','#4CC9F0','#4895EF','#7B5EA7','#F72585'];
  var maxV=Math.max(d.total_expense,d.total_income,1);
  var net=d.net,nc=net>=0?'var(--acc)':'var(--red)';
  document.getElementById('rv-overview').innerHTML=
    '<div class="hbar-row"><div class="hbar-label"><span class="hl-name">支出</span><span class="hl-val" style="color:var(--red)">-NT$ '+fmt(d.total_expense)+'</span></div><div class="hbar-track"><div class="hbar-fill" style="width:'+(d.total_expense/maxV*100).toFixed(1)+'%;background:var(--red)"></div></div></div>'
    +'<div class="hbar-row"><div class="hbar-label"><span class="hl-name">收入</span><span class="hl-val" style="color:var(--acc)">+NT$ '+fmt(d.total_income)+'</span></div><div class="hbar-track"><div class="hbar-fill" style="width:'+(d.total_income/maxV*100).toFixed(1)+'%;background:var(--acc)"></div></div></div>'
    +'<div class="rpt-divider"></div><div class="rpt-total"><span class="rt-lbl">總計結餘</span><span class="rt-val" style="color:'+nc+'">'+(net>=0?'+':'')+'NT$ '+fmt(Math.abs(net))+'</span></div>';
  var cf=flattenCats(S.cfg.categories&&S.cfg.categories.expense||[]);
  var topCats=S.cfg.categories&&S.cfg.categories.expense||[];
  // 將 cat_breakdown 聚合到大類別（包含子類別金額加總）
  var bd=d.cat_breakdown||{};
  var topMap={};
  topCats.forEach(function(top){
    var ids=[top.id].concat((top.children||[]).map(function(c){return c.id;}));
    var sum=ids.reduce(function(a,cid){return a+(bd[cid]||0);},0);
    if(sum>0) topMap[top.id]=sum;
  });
  // 也加入沒有大類別對應的
  Object.entries(bd).forEach(function(e){
    var cid=e[0],v=e[1];
    var isChild=topCats.some(function(top){return (top.children||[]).some(function(c){return c.id===cid;});});
    if(!isChild&&!topMap[cid]) topMap[cid]=v;
  });
  var ce=Object.entries(topMap).sort(function(a,b){return b[1]-a[1];}).slice(0,3);
  var allTotal=Object.values(topMap).reduce(function(a,b){return a+b;},0)||1;

/* 日期 badge */
function syncDateBadge(dateVal, timeVal){
  var dv=dateVal!==undefined ? dateVal : document.getElementById('f-date').value;
  var tv=timeVal!==undefined ? timeVal : document.getElementById('f-time').value;
  var bd=document.getElementById('dbdtxt');
  var bt=document.getElementById('dbttxt');
  if(bd){if(dv){var p=dv.split('-'),dw=['日','一','二','三','四','五','六'][new Date(dv+'T00:00:00').getDay()];bd.textContent=parseInt(p[1])+'月'+parseInt(p[2])+'日（'+dw+'）';}else bd.textContent='—';}
  if(bt)bt.textContent=tv||'—';
  // 設定隱藏 input 值
  var fd=document.getElementById('f-date');
  var ft=document.getElementById('f-time');
  if(fd&&dv&&dateVal!==undefined) fd.value=dv;
  if(ft&&tv&&timeVal!==undefined) ft.value=tv;
  // 同步可見的 input
  var fdv=document.getElementById('f-date-vis');
  var ftv=document.getElementById('f-time-vis');
  if(fdv&&dv) fdv.value=dv;
  if(ftv&&tv) ftv.value=tv;
  if(fd&&!fd._sb){fd._sb=1;fd.addEventListener('change',function(){syncDateBadge();});}
  if(ft&&!ft._sb){ft._sb=1;ft.addEventListener('change',function(){syncDateBadge();});}
}

function openAddPage(rec){
  // track editing record
  if(rec){
    S.editRec = rec;
  } else {
    S.editRec = null;
  }
  // optional record for editing
  if(rec){
    S.addType=rec.type||'expense';
    if(S.addType==='transfer'){
      S.transferCat = rec.category||'deposit';
    }
    // prepare items
    if(S.addType==='transfer'){
      S.addItems = (rec.items||[]).map(it=>({from:it.from||'',to:it.to||'',amount:it.amount||0}));
    } else if(S.addType==='adjust'){
      S.addItems = (rec.items||[]).map(it=>({amount:it.amount||0}));
    } else {
      S.addItems = (rec.items||[]).map(it=>({
        qty:it.qty||'1',price:it.price||'',note:it.note||'',category:it.category||'',
        categoryName: (S.cfg.categories[S.addType]||[]).flatMap(c=>[c].concat(c.children||[])).find(x=>x.id===it.category)?.name||''
      }));
    }
    S.selCat=rec.items&&rec.items[0]?rec.items[0].category:'';
  } else {
    S.addType='expense'; S.addItems=[{qty:'1',price:'',note:'',category:'',categoryName:''}]; S.selCat='';
    _selPiggy=null;
  }
  document.querySelectorAll('.type-tab[data-t]').forEach(t=>
    t.className='type-tab'+(t.dataset.t===S.addType?` on ${S.addType}`:''));
  fillAddSelects(S.addType);
  renderTransferTypes();
  renderModalCats(S.addType);
  document.getElementById('cat-section').style.display='none';
  // apply new layout visibility
  const _standaloneAcc2 = document.getElementById('standalone-acc');
  const _standaloneMer2 = document.getElementById('standalone-mer');
  const _piggyNoteRow2  = document.getElementById('piggy-note-row');
  const _infoNoteFg2    = document.getElementById('info-note-fg');
  const _totalDispEl2   = document.getElementById('total-disp');
  const _infoSecEl2     = document.getElementById('info-section');
  const _isPiggy2       = S.addType==='piggy';
  const _isTransfer2    = S.addType==='transfer';
  const _isAdjust2      = S.addType==='adjust';
  const _isIncome2      = S.addType==='income';
  _standaloneAcc2.style.display = (_isTransfer2||_isPiggy2) ? 'none' : '';
  _standaloneMer2.style.display = (_isTransfer2||_isAdjust2||_isPiggy2) ? 'none' : '';
  _piggyNoteRow2.style.display  = _isPiggy2 ? '' : 'none';
  if(_infoNoteFg2) _infoNoteFg2.style.display = _isIncome2 ? 'none' : '';
  _totalDispEl2.style.display   = _isPiggy2 ? 'none' : '';
  _infoSecEl2.style.display     = (_isTransfer2||_isAdjust2||_isPiggy2) ? 'none' : '';
  document.getElementById('add-item-btn').style.display = (S.addType==='expense'||S.addType==='income'?'block':'none');
  document.querySelectorAll('.items-section').forEach(el=>{ el.style.display=_isPiggy2?'none':''; });
  // date/time/note
  if(rec){
    document.getElementById('f-date').value=rec.date||todayStr();
    document.getElementById('f-time').value=rec.time||nowTime();
    document.getElementById('f-note').value=rec.note||'';
    document.getElementById('f-acc').value=rec.account||'';
    document.getElementById('f-to-acc').value=rec.to_account||'';
    document.getElementById('f-mer').value=rec.merchant||'';
    document.getElementById('f-exp').value=rec.expert||'';
  } else {
    document.getElementById('f-date').value=S.selDate||todayStr();
    document.getElementById('f-time').value=nowTime();
    document.getElementById('f-note').value='';
  }
  document.getElementById('info-body').classList.remove('open');
  document.getElementById('info-toggle').classList.remove('open');
  renderPiggyTypeSection();
  renderAddItems(); calcTotal();
  // 直接傳值給 syncDateBadge，不靠讀取 input
  var _d=rec?(rec.date||todayStr()):(S.selDate||todayStr());
  var _t=rec?(rec.time||nowTime()):nowTime();
  syncDateBadge(_d, _t);
  openOverlay('add-page');
}

function renderModalCats(type, parent){
  // keep track of the type we're currently browsing/adding to
  S.subCatType = type;
  // 如果是轉帳型別，強制使用三個固定子類別
  if(type==='transfer' && !parent){
    const fixed=[
      {id:'deposit',name:'存款',color:'#2ECC8F',icon:'/icon/轉帳/存款.png'},
      {id:'withdraw',name:'提款',color:'#FF5F6D',icon:'/icon/轉帳/提款.png'},
      {id:'transfer',name:'轉帳',color:'#4CC9F0',icon:'/icon/轉帳/轉帳.png'},
    ];
    S.cfg.categories.transfer=fixed; // 保證後續也有資料
  }

  const cats=(parent&&parent.children)?parent.children:(S.cfg.categories[type]||[]);
  const grid=document.getElementById('modal-cat-grid');
  grid.innerHTML='';

  // 如果有上層，加入返回按鈕（只有當該層確實有子分類時才顯示）
  if(parent && parent.children && parent.children.length){
    const back=document.createElement('div'); back.className='cat-chip';
    back.innerHTML='<span>◀ 返回</span>';
    back.addEventListener('click',()=>renderModalCats(type));
    grid.appendChild(back);
  }

  cats.forEach(c=>{
    const chip=document.createElement('div'); chip.className='cat-chip';
    chip.dataset.id=c.id;
    chip.style.setProperty('--chip-c', c.color||'#8B909A');
    const iconHtml = c.icon ? `<img class="cat-icon" src="${c.icon}" alt="${c.name}" />` : '';
    chip.innerHTML=`${iconHtml}<span>${c.name}</span>`;
    chip.addEventListener('click',()=>{
      if(c.children&&c.children.length){
        renderModalCats(type,c);
        return;
      }
      // if selecting for a specific item, assign there
      if(S.selItemForCat!==null && S.addItems[S.selItemForCat]){
        const idx=S.selItemForCat;
        S.addItems[idx].category=c.id;
        S.addItems[idx].categoryName=c.name;
        S.selItemForCat=null;
        renderAddItems();
        document.getElementById('cat-section').style.display='none';
        return;
      }
      S.selCat=c.id;
      grid.querySelectorAll('.cat-chip').forEach(ch=>{
        ch.className='cat-chip'; ch.style.borderColor=''; ch.style.background=''; ch.style.color='';
      });
      chip.classList.add(`on-${type}`);
      document.getElementById('cat-section').style.display='none';
    });
    grid.appendChild(chip);
  });
  // always provide add button at end
  const addChip=document.createElement('div'); addChip.className='cat-chip';
  addChip.innerHTML='<span>＋ 新增</span>';
  addChip.addEventListener('click',()=>{
    S.catParentForAdd = parent || null;
    document.getElementById('ncat-name').value='';
    document.getElementById('ncat-color').value='#8B909A';
    initCatPalette();
    document.getElementById('add-cat-overlay').classList.add('show');
  });
  grid.appendChild(addChip);
  // 若已選的分類在新類型中存在，自動標記
  if(S.selCat){
    const existing=grid.querySelector(`[data-id="${S.selCat}"]`);
    if(existing) existing.classList.add(`on-${type}`);
    else S.selCat='';
  }
}

function calcTotal(){
  let t=0;
  if(S.addType==='transfer'){
    t=S.addItems.reduce((s,it)=>s+parseFloat(it.amount||0),0);
  } else if(S.addType==='income'){
    t=S.addItems.reduce((s,it)=>s+(parseFloat(it.qty)||1)*(parseFloat(it.price)||0),0);
  } else if(S.addType==='adjust'){
    t=S.addItems.reduce((s,it)=>s+parseFloat(it.amount||0),0);
  } else {
    t=S.addItems.reduce((s,it)=>s+(parseFloat(it.qty)||1)*(parseFloat(it.price)||0),0);
  }
  document.getElementById('total-val').textContent=fmt(t);
}

      };

      pg.logs.push({date:payload.date,amount:amt,note:payload.note});
      advSave('piggy',piggies);
      await renderHome(); await loadCfg();
      closeOverlay('add-page');
      toast('已存入「'+pg.name+'」NT$'+fmt(amt),3000);
      _selPiggy=null;
      return;
    }
    if(S.addType==='transfer'){
      total=S.addItems.reduce((s,it)=>s+parseFloat(it.amount||0),0);
      if(!total){ toast('請輸入金額'); return; }
      if(!S.transferCat){ toast('請選擇轉帳類別'); return; }
      for(const it of S.addItems){ if(!it.from||!it.to){toast('請選擇轉出與轉入帳戶'); return;} }
    } else if(S.addType==='adjust'){
      total = parseFloat(S.addItems[0]?.amount||0);
      if(isNaN(total)){ toast('請輸入金額'); return; }
      const accId=document.getElementById('f-acc').value;
      if(!accId){ toast('請選擇帳戶'); return; }
    } else {
      total=S.addItems.reduce((s,it)=>s+(parseFloat(it.qty)||1)*(parseFloat(it.price)||0),0);
      if(!total){ toast('請輸入金額'); return; }
      // ensure each item has category
      for(const it of S.addItems){ if(!it.category){ toast('請為每項選擇分類'); return; }}
    }
    let note=document.getElementById('f-note').value;
    if(S.addType==='adjust' && !note){
      note=`調整後 NT$ ${fmt(total)}`;

    const payload={
      type:S.addType,
      items: S.addItems.map(it=>{
        if(S.addType==='transfer') return {from:it.from,to:it.to,amount:parseFloat(it.amount||0),category:S.transferCat};
        if(S.addType==='adjust') return {amount:parseFloat(it.amount||0)};
        return {qty:parseFloat(it.qty)||1,price:parseFloat(it.price)||0,note:it.note,category:it.category};
      }),
      category:S.addType==='transfer'?S.transferCat:(S.addType==='adjust'?'adjust':(S.addItems[0]?.category||'')),
      account:S.addType==='transfer'?S.addItems[0]?.from||'':document.getElementById('f-acc').value,

      expert:(S.addType==='transfer'||S.addType==='adjust'||S.addType==='piggy')?'':document.getElementById('f-exp').value,
      date:document.getElementById('f-date').value,
      time:document.getElementById('f-time').value,
      note,
    };
    // choose POST vs PUT depending on edit state
    if(S.editRec && S.editRec.id){
      await api(`/api/records/${S.editRec.id}`,{method:'PUT',body:JSON.stringify(payload)});
      S.editRec=null;
    } else {
      await api('/api/records',{method:'POST',body:JSON.stringify(payload)});
    }
    if(S.addType==='adjust'){
      // keep account balance in sync with the adjusted value
      const accId = payload.account;
      await api(`/api/settings/accounts/${accId}`,{method:'PUT',body:JSON.stringify({balance:total})});
      await loadCfg();
    }
    document.getElementById('cat-section').style.display='none';
    // 若選了存錢筒，自動存入
    if(_selPiggy!==null&&S.addType==='expense'){
      try{
        const piggies=advLoad('piggy');
        const pg=piggies[_selPiggy];
        if(pg){
          pg.saved=(pg.saved||0)+total;
          pg.logs=pg.logs||[];
          pg.logs.push({date:payload.date,amount:total,note:payload.note||''});
          advSave('piggy',piggies);
          toast('記錄成功 ✓，已存入「'+pg.name+'」',3000);
        }
      }catch(e){}
      _selPiggy=null;
    } else {
      toast('記錄成功 ✓');
    }
    closeOverlay('add-page');
    // after submitting a new record (or update), refresh the home view so the calendar
    // and list update correctly. If the record is in a different month, move the
    // calendar there first.
    const [y,m]=payload.date.split('-').map(s=>parseInt(s,10));
    S.calY=y; S.calM=m;
    S.selDate=payload.date;
    await loadCfg();
    await renderHome();
    goPage('home');
    if(document.getElementById('page-accounts').classList.contains('active')) renderAccounts();
  }catch(e){
    console.error(e);
    toast('新增失敗：'+(e.message||e));
  }
});
